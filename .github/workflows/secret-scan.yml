name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan history and checked-out files
        shell: bash
        run: |
          umask 077
          rules=$(mktemp -d)
          trap 'rm -rf -- "$rules"' EXIT
          printf '[extend]\nuseDefault = true\n' > "$rules/rules.toml"
          touch "$rules/empty.ignore"
          scanner="$(go env GOPATH)/bin/gitleaks"
          flags=(--config "$rules/rules.toml" --gitleaks-ignore-path "$rules/empty.ignore"
            --ignore-gitleaks-allow --redact=100 --no-banner --max-archive-depth=1 --timeout=180)
          if ! "$scanner" git "${flags[@]}" --log-opts='--all --reflog --full-history -m' >/dev/null 2>&1 ||
             ! "$scanner" dir "${flags[@]}" . >/dev/null 2>&1; then
            echo 'Secret scan blocked. Findings and scanner diagnostics were suppressed.' >&2
            exit 1
          fi
